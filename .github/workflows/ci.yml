name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test Python backend
        run: python -m unittest discover -s tests -q
      - name: Test canvas geometry
        run: node tests/test_studio_core.js
      - name: Check frontend syntax
        run: |
          node --check src/t02studio/static/studio.js
          node --check src/t02studio/static/studio-alt-theme.js
