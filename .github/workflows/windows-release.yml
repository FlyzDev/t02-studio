name: Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install runtime and build dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.10,<7"
      - name: Test Python and JavaScript
        run: |
          python -m unittest discover -s tests -q
          node tests/test_studio_core.js
      - name: Build one-file executable on Windows
        run: python -m PyInstaller --clean --noconfirm T02-Studio.spec
      - name: Smoke-test the actual Windows executable
        run: python scripts/smoke_exe.py dist/T02-Studio.exe
      - name: Package executable, license, and SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 dist/T02-Studio.exe).Hash.ToLowerInvariant()
          "$hash  T02-Studio.exe" | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii
          Compress-Archive -Path dist/T02-Studio.exe,LICENSE,README.md -DestinationPath dist/T02-Studio-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: T02-Studio-Windows-x64
          if-no-files-found: error
          path: |
            dist/T02-Studio.exe
            dist/T02-Studio-Windows-x64.zip
            dist/SHA256SUMS.txt
      - name: Attach verified EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release create $tag dist/T02-Studio.exe dist/T02-Studio-Windows-x64.zip dist/SHA256SUMS.txt --verify-tag --title "T02 Studio $tag" --notes-file RELEASE_NOTES.md
